name: Appendfat identity inventory

on:
  push:
    branches:
      - appendfat-identity-inventory
    paths:
      - .github/workflows/identity-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out appendfat repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned Linux source
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: 238650ef6c7c7cca08e032527329424c9fbd70e5
          path: linux
          fetch-depth: 1

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libelf-dev

      - name: Configure FAT as modules
        run: |
          make -C linux defconfig
          linux/scripts/config --file linux/.config --module FAT_FS
          linux/scripts/config --file linux/.config --module VFAT_FS
          linux/scripts/config --file linux/.config --module MSDOS_FS
          linux/scripts/config --file linux/.config --disable FAT_KUNIT_TEST
          make -C linux olddefconfig
          make -C linux -j2 modules_prepare

      - name: Build stock and exact-copy FAT modules
        run: |
          make -C linux -j2 M=fs/fat modules
          rm -rf linux/fs/appendfat
          mkdir -p linux/fs/appendfat
          cp fs/appendfat/.kunitconfig linux/fs/appendfat/
          cp fs/appendfat/Kconfig fs/appendfat/Makefile fs/appendfat/*.c fs/appendfat/fat.h linux/fs/appendfat/
          make -C linux -j2 M=fs/appendfat modules

      - name: Generate collision inventory
        run: |
          mkdir -p docs
          stock=$(mktemp)
          copy=$(mktemp)
          collisions=$(mktemp)
          exports=$(mktemp)

          nm -g --defined-only linux/fs/fat/fat.o linux/fs/fat/vfat.o linux/fs/fat/msdos.o \
            | awk 'NF >= 3 { print $NF }' | sort -u > "$stock"
          nm -g --defined-only linux/fs/appendfat/fat.o linux/fs/appendfat/vfat.o linux/fs/appendfat/msdos.o \
            | awk 'NF >= 3 { print $NF }' | sort -u > "$copy"
          comm -12 "$stock" "$copy" > "$collisions"

          grep -RhoE 'EXPORT_SYMBOL(_GPL)?\([^)]*\)' fs/appendfat/*.c \
            | sed -E 's/^EXPORT_SYMBOL(_GPL)?\(([^)]*)\)$/\2/' \
            | sort -u > "$exports"

          {
            echo '# appendfat identity collision inventory'
            echo
            echo 'Generated from the exact source baseline pinned to Linux commit `238650ef6c7c7cca08e032527329424c9fbd70e5`.'
            echo
            echo 'Both the stock `fs/fat` copy and `fs/appendfat` were compiled as modules from that same kernel tree before this inventory was produced. This is an identity/collision inventory, not an append-allocation behavior test.'
            echo
            echo '## Build-name collisions'
            echo
            echo '- common module: `fat.ko`'
            echo '- VFAT module: `vfat.ko`'
            echo '- MS-DOS module: `msdos.ko`'
            echo '- registered filesystem names: `vfat` and `msdos`'
            echo
            echo 'These must become independent appendfat identities before stock FAT and appendfat can coexist.'
            echo
            echo '## Defined global symbols shared by stock and exact copy'
            echo
            echo 'The list comes from `nm -g --defined-only` on the three linked module objects on each side. `init_module` and `cleanup_module` are module-loader boilerplate; the remaining shared globals require deliberate namespacing for a robust built-in/module coexistence boundary.'
            echo
            echo '```text'
            cat "$collisions"
            echo '```'
            echo
            echo '## Kernel-exported FAT symbols'
            echo
            echo 'These are explicitly exported by the copied source and therefore cannot retain the stock names in an independently loadable derivative.'
            echo
            echo '```text'
            cat "$exports"
            echo '```'
            echo
            echo '## Identity-only next step'
            echo
            echo 'The first derivative change should rename module/configuration/filesystem identities and namespace the copied globals while leaving FAT parsing, allocation, mapping, directory, writeback, and on-disk behavior unchanged. A coexistence build must compile stock FAT and appendfat together from the same pinned kernel tree.'
          } > docs/identity-symbols.md

          cat docs/identity-symbols.md

      - name: Commit inventory
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/identity-symbols.md
          git commit -m 'Record exact FAT identity collisions'
          git push origin HEAD:appendfat-identity-inventory
