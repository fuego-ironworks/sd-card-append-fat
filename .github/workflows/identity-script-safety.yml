name: Identity transform safety guard

on:
  push:
    branches:
      - appendfat-independent-identity
    paths:
      - .github/workflows/identity-script-safety.yml

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          sh -n scripts/namespace-appendfat.sh
          sh -n scripts/install-appendfat-into-linux.sh
      - name: Refuse transformed source
        run: |
          if sh scripts/namespace-appendfat.sh >out.log 2>err.log; then
            echo 'namespace transform unexpectedly accepted transformed source' >&2
            exit 1
          fi
          cat err.log
          grep -F 'refusing namespace transform:' err.log
