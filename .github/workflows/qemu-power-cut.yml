name: QEMU appendfat abrupt power cut

on:
  push:
    paths:
      - 'fs/appendfat/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/append-arena-design.md'
      - 'docs/acceptance-gates.md'
      - '.github/workflows/qemu-power-cut.yml'
  pull_request:
    paths:
      - 'fs/appendfat/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/append-arena-design.md'
      - 'docs/acceptance-gates.md'
      - '.github/workflows/qemu-power-cut.yml'

jobs:
  power-cut:
    runs-on: ubuntu-latest
    steps:
      - name: Check out appendfat repository
        uses: actions/checkout@v4

      - name: Check out pinned Linux source
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: 238650ef6c7c7cca08e032527329424c9fbd70e5
          path: linux
          fetch-depth: 1

      - name: Install build and VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev qemu-system-x86 busybox-static dosfstools cpio

      - name: Cut power after synced appendfat writes and verify with stock vfat
        run: sh tests/qemu-power-cut.sh linux
